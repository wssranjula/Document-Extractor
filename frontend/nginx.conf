server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream api;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://$upstream:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
